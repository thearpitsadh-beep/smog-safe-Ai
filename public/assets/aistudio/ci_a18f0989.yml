name: SmogSafe AI Executive v4 quality checks
on:
  push:
  pull_request:
jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native Node checks and regression suite
        run: npm run check
      - name: Local API performance smoke check
        run: npm run benchmark
  browser-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless Chromium via Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test the offline application on desktop and mobile
        run: npm run browser:offline
      - name: Test mocked live-data freshness and race handling
        run: npm run browser:trust
      - name: Check keyboard, button names and small-screen reflow
        run: python3 scripts/browser_accessibility.py
      - name: Run four-viewport extended accessibility smoke checks
        run: python3 scripts/browser_deep_accessibility.py
